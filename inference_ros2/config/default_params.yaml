keypoint_detector_node:
  ros__parameters:
    # Operating mode ("detection" or "image")
    visualization: false
    
    # Input image topic
    image_topic: "/oak/rgb/image_raw/compressed"
    queue_size: 10
    # Model settings
    # model_precision: "int8"
    # model_path: "/home/docker/ros2_ws/src/inference_ros2/model/yolov11m-pose-rtx-2060-int8-8.6.1-800.engine"

    # Model settings
    model_precision: "fp16"
    model_path: "/home/docker/ros2_ws/src/inference_ros2/model/yolov11m-pose-rtx-2060-fp16-8.6.1-800.engine"
    
    # Detection parameters
    confidence_threshold: 0.5
    iou_threshold: 0.4
    max_detections: 200
    
    # Image processing
    roi:
      height: 1024  # Crop height from top
      x_min: 0   # Crop width from left
      x_max: 1400  # Crop width from right


motion_tracking_node:
  ros__parameters:
    # Input topics
    image_topic: "/oak/rgb/image_raw/compressed"
    detection_topic: "/inference/Keypoint2DDetArray"
    use_cuda: false  # Use CUDA for GPU acceleration
    visualization: false  # Enable visualization output
    queue_size: 10  # Queue size for subscribers and publishers
    
    # Memory management parameters
    tracker_reset_interval: 500  # Reset tracker every N frames to prevent memory accumulation
    max_tracks: 30  # Maximum number of tracks to maintain (prevents memory issues)
    
    # Image processing ROI
    roi:
      height: 1024
      x_min: 0
      x_max: 1400

    # Tracking parameters (ByteTrack)
    tracking:
      track_thresh: 0.3
      track_buffer: 30
      match_thresh: 0.9
      frame_rate: 10
      odom_std_weight: 0.025

point_estimator_node:
  ros__parameters:
    # Estimation method ("depth" or "geometric")
    estimation_method: "geometric"
    
    # Input topics
    keypoint_topic: "/tracking/tracked_keypoints"
    depth_topic: "/oak/stereo/image_raw"
    camera_info_topic: "/oak/rgb/camera_info"
    
    # Depth estimation parameters
    depth_sample_size: 13
    
    # Geometric estimation parameters
    camera_height: 0.7  # meters
    camera_tilt: 0.0   # degrees
    
    # Synchronization parameters
    sync_queue_size: 50
    sync_slop: 0.5  # seconds