keypoint_detector_node:
  ros__parameters:
    # Operating mode ("detection" or "image")
    operation_mode: "detection"
    
    # Input image topic
    image_topic: "/sensors/zed_l/zed_node/rgb/image_rect_color"
    
    # Model settings
    model_precision: "fp32"
    model_path: "/home/docker/ros2_ws/src/inference_ros2/model/yolov8-keypoint-det-cropweed-nuc-fp32-23.10.engine"
    
    # Detection parameters
    confidence_threshold: 0.5
    iou_threshold: 0.4
    max_detections: 200
    
    # Image processing
    roi:
      height: 800  # Crop height from top
      x_min: 360   # Crop width from left
      x_max: 1160  # Crop width from right


motion_tracking_node:
  ros__parameters:
    # Input topics
    image_topic: "/sensors/zed_l/zed_node/rgb/image_rect_color"
    detection_topic: "/inference/Keypoint2DDetArray"

    # Image processing ROI
    roi:
      height: 800
      x_min: 360
      x_max: 1160

    # Tracking parameters (ByteTrack)
    tracking:
      track_thresh: 0.3
      track_buffer: 30
      match_thresh: 0.9
      frame_rate: 5
      odom_std_weight: 0.025

point_estimator_node:
  ros__parameters:
    # Estimation method ("depth" or "geometric")
    estimation_method: "depth"
    
    # Input topics
    keypoint_topic: "/tracking/tracked_keypoints"
    depth_topic: "/sensors/zed_l/zed_node/depth/depth_registered"
    camera_info_topic: "/sensors/zed_l/zed_node/rgb/camera_info"
    
    # Depth estimation parameters
    depth_sample_size: 5
    
    # Geometric estimation parameters
    camera_height: 1.0  # meters
    camera_tilt: 30.0   # degrees
    
    # Synchronization parameters
    sync_queue_size: 10
    sync_slop: 0.1  # seconds